server:
  port: 8080

spring:
  application:
    name: FarmConnect
  datasource:
    url: jdbc:h2:mem:farmconnectdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# FarmConnect Business Configuration
farmconnect:
  privacy:
    enforce-anonymization: true
    default-contact-gateway: "support@farmconnect.internal"
  security:
    admin-registration-code: "FC-ADMIN-2026"
