server:
  port: 8080

spring:
  application:
    name: FarmConnect-Test
  datasource:
    url: jdbc:h2:mem:farmconnectdb_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

farmconnect:
  privacy:
    enforce-anonymization: true
    default-contact-gateway: "support@farmconnect.internal"
  security:
    admin-registration-code: "FC-ADMIN-2026"
  sms:
    enabled: false
    fast2sms-api-key: ""

